<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超大量絵文字爆発サイト</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #111;
      font-family: sans-serif;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .info {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-weight: bold;
      font-size: 18px;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 20px;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div class="info">画面をタップ/クリックでさらに大爆発！</div>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // 出現させる絵文字のリスト
    const emojis = [
      '🎉', '✨', '🔥', '🚀', '💥', '🍕', '🐱', '🌈', '💎',
      '🥳', '💩', '👑', '🌟', '🦄', '🍔', '⚡', '❤️', '🤩'
    ];

    const particles = [];

    // パーティクル（絵文字）クラス
    class EmojiParticle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.emoji = emojis[Math.floor(Math.random() * emojis.length)];
        this.size = Math.random() * 30 + 20; // 20px 〜 50px
        
        // 飛び散る速度
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 25 + 5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        
        this.gravity = 0.3;
        this.bounce = 0.7;
        this.friction = 0.98;
        this.alpha = 1;
        this.decay = Math.random() * 0.005 + 0.002; // 徐々に消える
      }

      update() {
        this.vx *= this.friction;
        this.vy += this.gravity;

        this.x += this.vx;
        this.y += this.vy;

        // 画面の底で跳ね返る
        if (this.y + this.size / 2 > height) {
          this.y = height - this.size / 2;
          this.vy *= -this.bounce;
        }

        // 左右の壁で跳ね返る
        if (this.x - this.size / 2 < 0 || this.x + this.size / 2 > width) {
          this.vx *= -this.bounce;
        }

        this.alpha -= this.decay;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.font = `${this.size}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.emoji, this.x, this.y);
        ctx.restore();
      }
    }

    // 指定位置から大量発生させる関数
    function explode(x, y, count = 100) {
      for (let i = 0; i < count; i++) {
        particles.push(new EmojiParticle(x, y));
      }
    }

    // サイトを開いた瞬間に超大量爆発（500個）
    function initialExplosion() {
      explode(width / 2, height / 2, 300);
      explode(width * 0.2, height * 0.3, 100);
      explode(width * 0.8, height * 0.3, 100);
    }

    // クリック/タップで追加爆発
    window.addEventListener('pointerdown', (e) => {
      explode(e.clientX, e.clientY, 80);
    });

    // メインアニメーションループ
    function loop() {
      ctx.clearRect(0, 0, width, height);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();

        // 消えたパーティクルを配列から削除
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      requestAnimationFrame(loop);
    }

    // 開始
    initialExplosion();
    loop();
  </script>
</body>
</html>
